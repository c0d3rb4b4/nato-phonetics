name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved version on main (for example 1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: production-release
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      CI: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the requested version and signing inputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          NATO_UPLOAD_STORE_PASSWORD: ${{ secrets.NATO_UPLOAD_STORE_PASSWORD }}
          NATO_UPLOAD_KEY_ALIAS: ${{ secrets.NATO_UPLOAD_KEY_ALIAS }}
          NATO_UPLOAD_KEY_PASSWORD: ${{ secrets.NATO_UPLOAD_KEY_PASSWORD }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          IOS_SIGNING_CONFIG: ${{ secrets.IOS_SIGNING_CONFIG }}
          IOS_EXPORT_OPTIONS: ${{ secrets.IOS_EXPORT_OPTIONS }}
        run: |
          node -e 'const v = require("./package.json").version; if (!/^\d+\.\d+\.\d+$/.test(v) || process.env.RELEASE_VERSION !== v) throw Error("Select the package version on main.")'
          : "${ANDROID_KEYSTORE:?}" "${NATO_UPLOAD_STORE_PASSWORD:?}" "${NATO_UPLOAD_KEY_ALIAS:?}" "${NATO_UPLOAD_KEY_PASSWORD:?}"
          : "${IOS_CERTIFICATE:?}" "${IOS_CERTIFICATE_PASSWORD:?}" "${IOS_PROFILE:?}" "${IOS_SIGNING_CONFIG:?}" "${IOS_EXPORT_OPTIONS:?}"
      - uses: ruby/setup-ruby@v1
        with:
          bundler: '2.4.22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned build tools
        run: |
          npm install --global npm@10.9.4
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;27.1.12297006' 'cmake;3.22.1' 'cmake;3.30.5'
      - name: Prepare Apple signing
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          IOS_SIGNING_CONFIG: ${{ secrets.IOS_SIGNING_CONFIG }}
          IOS_EXPORT_OPTIONS: ${{ secrets.IOS_EXPORT_OPTIONS }}
        shell: bash
        run: bash .github/prepare-ios-signing.sh
      - name: Archive, export and verify the iOS app
        shell: bash
        run: |
          node scripts/host-build.cjs ios-archive --install --jobs 2 --output artifacts/apple-archive
          NATO_EXPORT_OPTIONS_PLIST="$RUNNER_TEMP/export-options.plist" \
            node scripts/host-build.cjs ios-export --jobs 2 --output artifacts/apple-export
          bash .github/verify-release-ipa.sh
      - name: Build and verify the signed Android APK and AAB
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          NATO_UPLOAD_STORE_PASSWORD: ${{ secrets.NATO_UPLOAD_STORE_PASSWORD }}
          NATO_UPLOAD_KEY_ALIAS: ${{ secrets.NATO_UPLOAD_KEY_ALIAS }}
          NATO_UPLOAD_KEY_PASSWORD: ${{ secrets.NATO_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          umask 077
          export NATO_UPLOAD_STORE_FILE="$RUNNER_TEMP/android-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE" | base64 -D > "$NATO_UPLOAD_STORE_FILE"
          node scripts/host-build.cjs android-release --jobs 2 --output artifacts/android
          node scripts/verify-host-artifacts.cjs artifacts/android android-release "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" --signed
      - name: Publish the three versioned files on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          base="artifacts/nato-phonetics-v$version"
          cp artifacts/android/app-release.apk "$base.apk"
          cp artifacts/android/app-release.aab "$base.aab"
          cp "$RUNNER_TEMP/verified.ipa" "$base.ipa"
          bash .github/publish-mobile-release.sh "v$version" "NATO Phonetics v$version" "$base.apk" "$base.aab" "$base.ipa"
      - name: Retain build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/apple-archive/*.json
            artifacts/apple-archive/logs/
            artifacts/apple-export/*.json
            artifacts/apple-export/logs/
            artifacts/android/*.json
            artifacts/android/logs/
          if-no-files-found: ignore
