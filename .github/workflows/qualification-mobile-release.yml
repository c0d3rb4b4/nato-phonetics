name: Check release Xcode configuration
on:
  push:
    branches: [qualification/mobile-release]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CI: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      BUNDLE_FROZEN: 'true'
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c35caa5d498ccd2d785018a6336bea2614737b07
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: ruby/setup-ruby@v1
        with:
          bundler: '2.4.22'
      - name: Inspect CocoaPods changes and app settings
        run: |
          npm install --global npm@10.9.4
          npm ci
          bundle install
          printf 'NATO_XCCONFIG_TEST = available\n' > ios/ReleaseSigning.local.xcconfig
          bundle exec pod install --deployment --project-directory=ios
          git status --short
          git diff --binary
          xcodebuild -workspace ios/NATOPhonetics.xcworkspace -scheme NATOPhonetics \
            -configuration Release -sdk iphoneos -showBuildSettings -json > "$RUNNER_TEMP/settings.json"
          node -e 'const s = require(process.argv[1]); const app = s.find(x => x.target === "NATOPhonetics").buildSettings; if (app.NATO_XCCONFIG_TEST !== "available" || !app.PODS_ROOT) throw Error("Missing app configuration");' "$RUNNER_TEMP/settings.json"
