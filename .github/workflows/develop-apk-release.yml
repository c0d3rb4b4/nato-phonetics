name: Develop APK Release

on:
  push:
    branches: [develop]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: develop-apk-release
  cancel-in-progress: true

jobs:
  release:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CI: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      CCACHE_DIR: ${{ github.workspace }}/artifacts/ccache
      # Use the NDK Clang build ID so SDK reinstall timestamps cannot bust the cache.
      CCACHE_COMPILERCHECK: '%compiler% --version'
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            package-lock.json
            scripts/patches/react-native-*.json
      - name: Restore Android compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: develop-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'android/**/*.gradle*', 'android/gradle.properties', 'scripts/patches/react-native-*.json') }}
          restore-keys: develop-ccache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Android compiler cache
        id: ccache
        continue-on-error: true
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ccache
          fi
          ccache --zero-stats
      - name: Install pinned build tools
        run: |
          npm install --global npm@10.9.4
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;27.1.12297006' 'cmake;3.22.1' 'cmake;3.30.5'
      - name: Build and verify the standalone APK
        env:
          GRADLE_OPTS: '-Dorg.gradle.caching=true'
          NATO_ANDROID_COMPILE_JOBS: '3'
          NATO_GRADLE_PROFILE: '1'
        run: |
          node scripts/host-build.cjs android-develop --install --jobs 3 --output artifacts/develop
          node scripts/verify-host-artifacts.cjs artifacts/develop android-develop "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Publish the APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          apk="artifacts/nato-phonetics-v$version-dev.apk"
          cp artifacts/develop/app-develop.apk "$apk"
          tag="dev-v$version-r$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"
          bash .github/publish-mobile-release.sh "$tag" "NATO Phonetics Dev v$version ($GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT)" "$apk"
      - name: Report compiler cache usage
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        continue-on-error: true
        run: ccache --show-stats
      - name: Retain build logs and Gradle timing
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: develop-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/develop/*.json
            artifacts/develop/logs/
            android/build/reports/profile/
          if-no-files-found: ignore
